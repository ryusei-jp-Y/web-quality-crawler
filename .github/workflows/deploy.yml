name: Deploy to VPS

# CI (ci.yml) が main で成功したときだけ VPS に SSH し、git pull → 再ビルド → 再起動する。
# 「CI が落ちるコードをデプロイしてしまう」事故を防ぐため、push 直トリガではなく
# workflow_run（CI 完了イベント）を起点にしてゲートしている。
# 重いビルドは VPS 側で走るため、GitHub Actions の消費時間はごく僅か（実質無料枠内）。
#
# 事前に GitHub リポジトリの Settings → Secrets and variables → Actions に登録:
#   VPS_HOST      … VPS の公開IP または ホスト名
#   VPS_USER      … ログインユーザ (例: root もしくは deploy 用ユーザ)
#   VPS_SSH_KEY   … 上記ユーザで入れる「秘密鍵」(公開鍵は VPS の authorized_keys に登録済みにする)
#   DEPLOY_PATH   … VPS 上にクローンしたこの repo のパス (例: /root/apps/web-quality-crawler)
# ※ Secrets 未設定のうちはデプロイ手順を自動スキップする（失敗させない）。

on:
  # CI ワークフローが main ブランチで完了したら発火（成功判定は下の if で行う）
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # 手動デプロイも許可（CI を通さず緊急で回したいとき）
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_run の場合は CI が success のときのみ。手動実行は無条件で許可。
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Guard — Secrets 未設定ならスキップ
        id: guard
        run: |
          if [ -n "$VPS_HOST" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS の Secrets が未設定のためデプロイをスキップしました。"
          fi

      - name: Deploy over SSH
        if: steps.guard.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "▶ pull"
            git pull --ff-only
            echo "▶ build & up"
            docker compose up -d --build
            echo "▶ cleanup"
            docker image prune -f
            echo "✅ deploy done"
