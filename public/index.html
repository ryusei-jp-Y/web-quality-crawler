<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Quality Crawler</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

<!-- Full-screen loading overlay (shown on initial load & heavy async operations) -->
<div class="app-loader" id="app-loader" role="status" aria-live="polite" aria-label="読み込み中">
  <div class="app-loader__inner">
    <svg class="app-loader__pulse" viewBox="0 0 24 24" aria-hidden="true">
      <circle class="app-loader__ring" cx="12" cy="12" r="10.2" fill="none"/>
      <path class="app-loader__line" pathLength="32"
            d="M2.5 12 H6.5 L8.5 15 L11.5 8 L13.5 13 H21.5"
            fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="app-loader__label">Quality Crawler</div>
    <div class="app-loader__sublabel" id="app-loader-sublabel">ダッシュボードを読み込んでいます…</div>
  </div>
</div>

<!-- ambient aurora layer -->
<div class="aurora" aria-hidden="true">
  <span class="aurora__blob aurora__blob--1"></span>
  <span class="aurora__blob aurora__blob--2"></span>
  <span class="aurora__blob aurora__blob--3"></span>
</div>

<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar__brand" id="brand-home" role="button" tabindex="0" title="ダッシュボードへ">
      <svg class="sidebar__logo" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 18c-4.41 0-8-3.59-8-8h2.5l2 3 3-7 2 5h4.5c0 4.41-3.59 7-8 7z"/>
      </svg>
      <div>
        <div class="sidebar__title">Quality Crawler</div>
        <div class="sidebar__subtitle" id="sidebar-subtitle">Web quality evaluator</div>
      </div>
    </div>

    <div class="sidebar__scroll sidebar__scroll--targets">
      <!-- サイト追加 (管理者のみ表示) -->
      <button type="button" class="sidebar__add-site" id="add-domain-btn">
        <svg viewBox="0 0 24 24" class="icon"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
        <span>サイトを追加</span>
      </button>
      <ul class="domain-list" id="domain-list">
        <li class="domain-list__placeholder">Loading…</li>
      </ul>
    </div><!-- /.sidebar__scroll -->

    <!-- Usage widget -->
    <div class="sidebar__section sidebar__section--collapsible sidebar__usage" id="usage-widget" data-sidebar-section="usage">
      <div class="sidebar__section-header">
        <button class="sidebar__section-toggle" type="button" data-sidebar-toggle="usage" aria-expanded="true">
          <svg class="sidebar__section-caret" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9.3 7.3a1 1 0 011.4 0l4 4a1 1 0 010 1.4l-4 4a1 1 0 01-1.4-1.4L12.58 12 9.3 8.7a1 1 0 010-1.4z"/></svg>
          <span class="sidebar__section-label">AI Usage <span class="usage-scope">(本日)</span></span>
        </button>
      </div>
      <div class="sidebar__section-body">
        <div class="usage-grid">
          <div class="usage-cell"><div class="usage-cell__label">Calls</div><div class="usage-cell__value" id="usage-calls">–</div></div>
          <div class="usage-cell"><div class="usage-cell__label">Tokens</div><div class="usage-cell__value" id="usage-tokens">–</div></div>
          <div class="usage-cell usage-cell--wide"><div class="usage-cell__label">Cost</div><div class="usage-cell__value" id="usage-cost">–</div></div>
        </div>
        <div class="usage-footer" id="usage-updated">–</div>
      </div>
      <div class="usage-tooltip" id="usage-tooltip" role="tooltip" aria-hidden="true"></div>
    </div>

    <!-- ドラッグでサイドバー幅を変更するハンドル -->
    <div class="sidebar__resizer" id="sidebar-resizer" role="separator" aria-orientation="vertical" title="ドラッグで幅を変更"></div>

  </aside>

  <!-- Floating help button -->
  <button class="help-fab" id="help-btn" title="ヘルプ" aria-label="ヘルプ">
    ？
  </button>

  <main class="main" id="main">
    <div class="loading">Loading…</div>
  </main>

</div>

<!-- Modal -->
<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal__header">
      <h3 class="modal__title" id="modal-title">追加</h3>
      <button class="btn-icon" id="modal-close" aria-label="閉じる">
        <svg viewBox="0 0 24 24" class="icon"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </header>
    <div class="modal__body" id="modal-body"></div>
  </div>
</div>

<script type="module" src="/js/dashboard.js"></script>
</body>
</html>
